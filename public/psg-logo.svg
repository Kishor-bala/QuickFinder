<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" fill="none">
  <!-- Outer Shield Container -->
  <path d="M 50 20 L 350 20 L 350 140 C 350 290 200 390 200 410 C 200 390 50 290 50 140 Z" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="12" stroke-linejoin="round"/>
  <path d="M 64 34 L 336 34 L 336 140 C 336 275 200 370 200 390 C 200 370 64 275 64 140 Z" fill="#FFFFFF"/>
  <path d="M 74 44 L 326 44 L 326 140 C 326 262 200 354 200 372 C 200 354 74 262 74 140 Z" fill="#1E3A8A"/>

  <!-- Top Text: PSG -->
  <text x="200" y="95" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">P S G</text>

  <!-- Left: Lotus Flower Symbol -->
  <g fill="#FFFFFF" transform="translate(90, 115) scale(0.9)">
    <path d="M 40 60 C 20 40 10 20 20 5 C 35 25 40 45 40 60 Z"/>
    <path d="M 40 60 C 60 40 70 20 60 5 C 45 25 40 45 40 60 Z"/>
    <path d="M 40 60 C 30 35 35 15 40 0 C 45 15 50 35 40 60 Z"/>
    <path d="M 10 50 C 0 35 15 35 25 45 C 20 55 15 55 10 50 Z"/>
    <path d="M 70 50 C 80 35 65 35 55 45 C 60 55 65 55 70 50 Z"/>
    <path d="M 15 65 C 30 65 50 65 65 65 C 60 72 20 72 15 65 Z"/>
  </g>

  <!-- Right: Flaming Torch Hand Symbol -->
  <g fill="#FFFFFF" transform="translate(230, 105) scale(0.95)">
    <!-- Flame -->
    <path d="M 45 5 C 55 20 65 35 50 55 C 40 40 30 25 45 5 Z"/>
    <path d="M 55 25 C 75 10 70 40 55 50 C 50 35 45 30 55 25 Z"/>
    <!-- Torch Bowl & Handle -->
    <path d="M 30 55 L 65 55 L 55 80 L 40 80 Z"/>
    <path d="M 42 80 L 53 80 L 45 125 L 37 125 Z"/>
    <circle cx="41" cy="130" r="5"/>
  </g>

  <!-- Curved Ribbon Banner across the shield -->
  <g>
    <!-- Ribbon Shadow/Backing -->
    <path d="M 10 230 C 80 270 320 150 390 190 L 390 230 C 320 190 80 310 10 270 Z" fill="#1E3A8A"/>
    <!-- Ribbon Body -->
    <path d="M 15 210 C 80 255 320 125 385 170 L 385 215 C 320 170 80 300 15 255 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="4"/>
    <!-- Ribbon Ends -->
    <path d="M 15 210 L 0 235 L 20 250 L 15 210 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M 385 170 L 400 195 L 380 210 L 385 170 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
    
    <!-- Tamil Motto inside Ribbon: அறிவு அன்பு பணி -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#1E3A8A">
      <textPath href="#ribbonPath" startOffset="50%" text-anchor="middle">அறிவு   அன்பு   பணி</textPath>
    </text>
    <path id="ribbonPath" d="M 25 240 C 90 275 310 150 375 190" fill="none"/>
  </g>

  <!-- Bottom: Road Symbol & CAS -->
  <path d="M 200 240 C 260 250 280 290 200 315 C 160 325 150 340 220 340 L 250 340 C 140 330 220 280 200 240 Z" fill="#FFFFFF"/>
  <text x="200" y="352" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CAS</text>

  <!-- Base Subtitle: Since 1947 -->
  <text x="200" y="440" font-family="'Outfit', sans-serif" font-weight="800" font-size="26" fill="#1E3A8A" text-anchor="middle" letter-spacing="2">Since 1947</text>
</svg>
